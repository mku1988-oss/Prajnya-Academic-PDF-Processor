# .\src\llm\providers\config\task_definitions\table_description.yaml
task_name: "table_description"
task_type: "table_conversion"
description: "Convert tables to Markdown format"

# EARMARK FOR POST-IMPLEMENTATION REVIEW (October 28, 2025):
# OlmOCR-2-7B-1025 may be trained to prefer HTML table format over Markdown.
# Official OlmOCR training explicitly used "Convert tables into HTML format" instruction.
# Current task outputs Markdown for consistency with olmocr-7b surgical extraction.
# ACTION: After Phase 2 implementation, closely monitor Tier 2 table extraction quality.
# If quality is poor, consider creating table_description_html.yaml variant.
# Testing: Compare Markdown vs HTML output quality on table-heavy pages.
# See Memory: "OlmOCR-2-7B Table Format Concern" entity for full context.

prompt: |
  CRITICAL VALIDATION: Before converting, verify this is a valid table.
  
  RETURN EMPTY STRING ("") IF:
  - Image shows only text (headers, footers, page numbers)
  - Image contains only decorative lines or borders
  - Image is a simple horizontal/vertical line
  - Image does not contain tabular data in rows and columns
  - Image is too small or unclear to extract table data
  - Image contains only a single word or label
  
  ONLY PROCEED WITH CONVERSION IF:
  - Image contains a clear table structure with rows and columns
  - Image has headers and data cells
  - Table data is readable and meaningful
  
  If valid, convert this table to Markdown format.
  
  Format:
  | Header 1 | Header 2 | Header 3 |
  |----------|----------|----------|
  | Data 1   | Data 2   | Data 3   |
  | Data 4   | Data 5   | Data 6   |
  
  RULES:
  - Use | (pipe) for column separators
  - Include header separator row with dashes (e.g., |----------|)
  - Align columns for readability (add spaces if needed)
  - Preserve all data accurately from the image
  - If cells are merged, repeat data or use spanning notation
  - Include table caption if visible in the image
  - Extract units and formatting (bold, italic) where visible
  - Preserve number precision (decimal places)
  
  Table structure:
  1. First row: Column headers (use | separators)
  2. Second row: Separator (use |---| pattern)
  3. Remaining rows: Data rows (use | separators)
  
  Special cases:
  - Empty cells: Leave blank between pipes (| |)
  - Multi-line cells: Use <br> for line breaks within cell
  - Numeric alignment: Right-align numbers when possible
  - Text alignment: Left-align text headers and values
  
  Caption handling:
  - If table has caption above/below: Include as line above table
  - If table has number (Table 1, Table 2): Include in caption
  - Format: **Table N:** Caption text
  
  Output ONLY the Markdown table, no additional explanatory text.

output_format:
  type: "text"
  expected_format: "markdown_table"
  example: |
    **Table 1:** Summary statistics for experimental groups
    
    | Parameter | Control | Treatment | p-value |
    |-----------|---------|-----------|---------|
    | Mean      | 12.3    | 18.7      | 0.001   |
    | SD        | 2.1     | 3.4       | -       |
    | N         | 30      | 30        | -       |

integration_notes:
  - "Output integrates directly into OlmoCR natural_text"
  - "No need for table numbering unless visible in image"
  - "Markdown tables render properly in most documentation systems"
  - "Can be further processed for LaTeX/HTML if needed"

quality_guidelines:
  - "Verify all columns aligned with proper | separators"
  - "Check header separator row has correct number of columns"
  - "Ensure data accuracy (double-check numbers and units)"
  - "Preserve column order from left to right"
  - "Include all visible rows (don't truncate large tables)"
  - "Test rendering in Markdown viewer if possible"
