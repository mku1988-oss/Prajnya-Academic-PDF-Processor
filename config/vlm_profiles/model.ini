[olmocr-2-7b]
model = models/allenAI/olmOCR-2-7B-1025.Q5_K_M.gguf
mmproj = models/allenAI/olmOCR-2-7B-1025.mmproj-f16.gguf
threads = 8
ctx-size = 16384
ubatch-size = 2048
batch-size = 2048
flash-attn = true
n-gpu-layers = 99
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.4
top-p = 0.95
min-p = 0.05
top-k = 40
repeat-penalty = 1.1
seed = 3407

# GLM-OCR (0.9B, zai-org): candidate PRIMARY offline OCR engine for the tier overhaul.
# GLM-V encoder + GLM-0.5B decoder, recognition-only (fixed prompts
# "Text Recognition:" / "Formula Recognition:"). Renders tables->markdown, inline math->LaTeX.
# Config validated 2026-07-10 on build b9936, BOTH via llama-mtmd-cli and via llama-server
# /models/load (the path the pipeline uses). REST output is byte-identical to CLI on the
# 5-page scanned set; GLM is deterministic at temp 0.02.
# flash-attn ON + q8_0 KV lets GLM-V ingest the FULL 300-DPI page on 8 GB (flash-OFF OOMs a
# 16 GB vision buffer). temp 0.02 per the llama.cpp OCR example.
# VRAM: ~2.3 GB resident. Cannot be co-resident with olmocr-2-7b (~6.8 GB) on an 8 GB card —
# always unload before load (RouterModeBackend.switch_model already does this).
# SEED IS LOAD-BEARING, NOT COSMETIC. temp 0.02 alone is NOT deterministic: three identical
# REST calls returned three different outputs, one of which silently switched the table format
# from markdown to LaTeX. With a fixed seed every repeat is byte-identical. A literature-review
# tool must return the same numbers for the same page on every run.
# no-cache-prompt: every page image is unique, so the prompt prefix never repeats and the cache
# never hits (measured: cached_tokens=0 on a fresh page). It buys nothing here and is one more
# piece of cross-request state that can perturb a supposedly deterministic decode.
[glm-ocr]
model = models/GLM/GLM-OCR-f16.gguf
mmproj = models/GLM/GLM-OCR-mmproj-GLM-OCR-Q8_0.gguf
threads = 8
ctx-size = 8192
flash-attn = true
n-gpu-layers = 99
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.02
seed = 3407
no-cache-prompt = true

# DeepSeek-OCR-2 (3B): used ONLY as a LAYOUT DETECTOR, never for table content.
# Its <|grounding|> mode emits <|ref|>table<|/ref|><|det|>[[x0,y0,x1,y1]]<|/det|> boxes in
# 0-1000 normalized coords, plus table_caption / table_footnote. Its `Parse the figure.` mode
# and its table HTML both FABRICATE and are never to be used (verdict 2026-07-09).
# Params are yesterday's finalized CLI config (run_test_build9936_kvcache_figures.ps1),
# translated to server flags: ctx 8192 + q8_0 KV + flash-attn on (fp16 KV OOMs on 8 GB),
# greedy temp 0, DRY sampler to suppress the repetition loops seen on the March build.
# chat-template deepseek-ocr is a NO-OP pass-through in llama.cpp, so the task token
# (<|grounding|>) must come from OUR prompt. jinja MUST be off or the template is ignored.
[deepseek-ocr-v2]
model = models/Deepseek/deepseek-ocr-q8_0.gguf
mmproj = models/Deepseek/mmproj-deepseek-ocr-q8_0.gguf
threads = 8
ctx-size = 8192
flash-attn = true
n-gpu-layers = 99
cache-type-k = q8_0
cache-type-v = q8_0
chat-template = deepseek-ocr
no-jinja = true
temp = 0.0
dry-multiplier = 0.8
dry-base = 1.75
dry-allowed-length = 2
; -1 used to mean "the whole context" and llama.cpp accepted it until the
; 2026-08-22 rebuild, which now REJECTS it outright:
;   error: invalid dry-penalty-last-n = -1
; The child server then exits instantly, the router reports
; "model name=deepseek-ocr-v2 failed to load", and because this model is
; only ever used for the FIGURE SECOND OPINION, the failure is silent --
; the escalation simply returns nothing and the page keeps zero figures.
; Measured cost: 8 of the corpus's 107 figures disappeared.
; 8192 is ctx-size, which is what -1 used to resolve to.
dry-penalty-last-n = 8192
seed = 3407
no-cache-prompt = true