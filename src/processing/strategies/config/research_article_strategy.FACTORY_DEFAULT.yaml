# Research Article Processing Strategy Configuration
# Version: 1.0
# Created: October 5, 2025
# Purpose: Configure VLM providers and processing parameters for research articles

strategy_name: "research_article"
strategy_type: "academic_paper_processing"
version: "1.2"  # Updated for Zotero integration
description: "Optimized processing strategy for research articles and reviews using VLM providers"

pipeline:
  log_level: "DEBUG" # Can be changed to "DEBUG", "WARNING", etc.
  text_threshold: 200            # minimum chars for native text to be considered valid
  tesseract:
    enabled: true
    dpi: 300
    tesseract_cmd: null         # optional path to tesseract binary, null means use PATH

processing:
  continue_on_error: true
  
  # ============================================================================
  # DEPRECATION NOTICE:
  # ============================================================================
  # The 'noninteractive' field below is NO LONGER READ by the Strategy.
  # 
  # WHY: Interactive/noninteractive mode is now controlled by the Runner,
  #      not the Strategy. This ensures clean separation of concerns:
  #      - Strategy = Pure document processing (deterministic)
  #      - Runner = User interaction decisions (stateful)
  # 
  # HOW TO USE: Pass the --noninteractive flag to the Runner CLI:
  #      python run_Prajnya.py --pdf file.pdf --noninteractive
  # 
  # BACKWARD COMPATIBILITY: Field kept here to prevent config errors,
  #                         but value is ignored.
  # ============================================================================
  noninteractive: false  # DEPRECATED - Use CLI flag instead 

zotero:
  # Master switch to enable/disable the entire Zotero integration
  enabled: true

  # Set to true for testing or offline use. Bypasses all API calls and relies only
  # on the local Semantic Ledger for metadata.
  offline_mode: false

  # Your Zotero API credentials.
  # BEST PRACTICE: Set these as environment variables, not directly here.
  # The code will automatically look for ZOTERO_API_KEY and ZOTERO_LIBRARY_ID.
  api_key: "${ZOTERO_API_KEY}"
  library_id: "${ZOTERO_LIBRARY_ID}"
  library_type: "user" # or "group"

# ============================================================================
# PROFILE & TASK REGISTRY (Single Source of Truth)
# ============================================================================
# Generic references (@registry.key) are resolved from this registry.
# To switch models globally: Change ONE line here → affects entire pipeline.
#
# Pattern: 
#   @profile_registry.default → Resolves to "olmocr-2-7b"
#   @task_registry.raw_ocr → Resolves to "raw_ocr_extraction"

profile_registry:
  # -------------------------------------------------------------------------
  # PRIMARY PROFILES
  # -------------------------------------------------------------------------
  
  # Default VLM profile for most processing tasks
  # Used by: Title pages, all body page tiers (except fallback)
  default: "olmocr-2-7b"
  
  # Fallback profile if default fails or for unknown page types
  # Uses older, more tested model for safety
  fallback: "olmocr-7b"
  
  # -------------------------------------------------------------------------
  # EXPERIMENTAL PROFILES (Future Use)
  # -------------------------------------------------------------------------
  # Uncomment to enable alternative models for testing
  
  # experimental: "olmocr-3-10b"     # Next-gen model (when available)
  # lightweight: "olmocr-2-1b"        # Faster, lower quality
  # specialized_math: "mathpix-ocr"   # Math-specific model
  
  # -------------------------------------------------------------------------
  # AUXILIARY PROFILES
  # -------------------------------------------------------------------------
  
  # Profile for title page detection (fast classification task)
  # Can be different from default if detection needs specific model
  title_detection: "olmocr-2-7b"

task_registry:
  # -------------------------------------------------------------------------
  # OCR TASKS (Two-Shot Processing)
  # -------------------------------------------------------------------------
  
  # Shot 1: Raw OCR extraction with document anchoring
  # Temperature: 0.05 (faithful transcription)
  raw_ocr: "raw_ocr_extraction"
  
  # Shot 2: Structured analysis for body pages
  # Output: JSON with natural_text + metadata
  structured_body: "structured_analysis_body_page"
  
  # Shot 2: Structured analysis for title pages
  # Output: JSON with title/authors/doi + metadata
  structured_title: "structured_analysis_title_page"
  
  # -------------------------------------------------------------------------
  # LEGACY TASKS (Single-Shot Processing)
  # -------------------------------------------------------------------------
  
  # Single-shot OCR with YAML front matter
  # Used for Tier 3 (large tables) and Tier 5 (fallback)
  legacy_ocr: "olmocr_document_processing"
  
  # -------------------------------------------------------------------------
  # SURGICAL TASKS (Isolated Element Extraction)
  # -------------------------------------------------------------------------
  # Used by Tier 2 surgical VLM processing
  
  figure_desc: "figure_description"       # Extract figure with description
  table_desc: "table_description"         # Extract table with caption
  equation_latex: "equation_to_latex"     # Convert equation to LaTeX
  
  # -------------------------------------------------------------------------
  # AUXILIARY TASKS
  # -------------------------------------------------------------------------
  
  # Fast visual classification: TITLE_PAGE vs COVER_PAGE
  title_detection: "title_page_detection"

# ============================================================================
# REGISTRY RESOLUTION RULES
# ============================================================================
# How @-references are resolved:
#
# 1. Syntax: @<registry_name>.<key>
#    Example: @profile_registry.default
#
# 2. Validation: Both registry and key must exist, else KeyError
#
# 3. Recursion: Not supported (registry values must be literals)
#    ✅ Valid:   profile_registry.default = "olmocr-2-7b"
#    ❌ Invalid: profile_registry.default = "@other_registry.key"
#
# 4. Scope: Only vlm_provider section supports resolution
#    Registries themselves are literal values only

# ============================================================================
# VLM PROVIDER CONFIGURATION
# ============================================================================
# Specifies which VLM profiles to use for different page types
# VLM profiles are self-contained configs in vlm_profiles/ directory
# To switch VLMs: just change the profile name!

vlm_provider:
  # VLM profile for title page processing
  # Profile contains model name, API parameters, resolution defaults, etc.
  title_page:
    processing_mode: "two_shot" # Explicitly use the two-shot method
    profile: "@profile_registry.default"  # ✅ Generic reference
    resolution_override: 1288   # Keep the high resolution for DOI capture
    
    # Define the tasks for each shot
    shot1_task: "@task_registry.raw_ocr"  # ✅ Generic reference
    shot2_task: "@task_registry.structured_title"  # ✅ Generic reference
  
  # ============================================================================
  # BODY PAGES - 5-TIER ADAPTIVE ROUTING
  # ============================================================================
  # Body pages now use adaptive routing to select optimal processing method
  # based on page characteristics. This is a "best of both worlds" approach
  # that preserves V4's efficiency while adding OlmOCR Hybrid's accuracy.
  
  body_pages:
    processing_mode: "adaptive"  # Use intelligent routing (vs fixed "vlm_only")
    
    # --- TIER DEFINITIONS ---
    # Each tier represents a different processing approach
    
    tier1_pymupdf:
      description: "Pure text extraction via PyMuPDF (fastest)"  
      performance: "~1s per page"
      # No config needed - handled directly in Python code
    
    tier2_surgical_vlm:
      description: "Surgical VLM processing for isolated elements"
      profile: "@profile_registry.default"  # ✅ Generic reference
      performance: "~30s per page"
      # Surgical tasks defined in surgical_vlm_helper.py
    
    tier3_single_shot:
      description: "OlmOCR single-shot for large tables"
      profile: "@profile_registry.default"  # ✅ Generic reference
      task: "@task_registry.legacy_ocr"  # ✅ Generic reference
      performance: "~60s per page"
    
    tier4_two_shot:
      description: "OlmOCR two-shot for complex/mixed content"
      profile: "@profile_registry.default"  # ✅ Generic reference
      shot1_task: "@task_registry.raw_ocr"  # ✅ Generic reference
      shot2_task: "@task_registry.structured_body"  # ✅ Generic reference
      performance: "~90s per page (most accurate)"
      deduplication: true  # Enable paragraph-level deduplication between shots
    
    tier5_fallback:
      description: "Original full VLM processing (fallback)"
      profile: "@profile_registry.fallback"  # ✅ Generic reference (intentionally different)
      task: "@task_registry.legacy_ocr"  # ✅ Generic reference
      performance: "~60-90s per page"
    
    # --- ADAPTIVE ROUTING RULES ---
    # Order matters: first match wins
    # Conditions are evaluated by page_classifier.py characteristics
    
    adaptive_routing_rules:
      - name: "pure_text_fast_path"
        conditions:
          page_type: "text_only"
        tier: "tier1_pymupdf"
        reason: "No visual elements = PyMuPDF is fastest and sufficient"
      
      - name: "simple_visual_surgical"
        conditions:
          page_type: "simple_visual"
        tier: "tier2_surgical_vlm"
        reason: "Isolated figures/tables = surgical extraction is efficient"
      
      - name: "large_table_only"
        conditions:
          has_large_table: true
          has_figures: false
          has_mixed_content: false
        tier: "tier3_single_shot"
        reason: "Large table without figures = single-shot handles well"
      
      - name: "complex_or_mixed"
        conditions:
          any_of:
            - page_type: "complex_visual"
            - has_mixed_content: true
            - has_dense_figures: true
        tier: "tier4_two_shot"
        reason: "Complex/mixed content = two-shot provides highest accuracy"
      
      - name: "default_fallback"
        conditions:
          default: true
        tier: "tier5_fallback"
        reason: "Unknown page characteristics = use tested fallback"
  
  # Fallback VLM if primary fails (future)
  fallback:
    profile: "numarkdown-8b"  # Will be created when needed
    enabled: false  # Not implemented in Phase 1

# ============================================================================
# PROCESSING PARAMETERS
# ============================================================================
# Controls how the strategy processes documents

processing:
  # Error handling
  continue_on_error: true  # Continue processing remaining pages if one fails
  fail_on_title_page_error: true  # But fail if title page fails (metadata critical)
  
  # Retry logic
  max_retries_per_page: 3
  retry_delay_seconds: 2  # Exponential backoff: 2s, 4s, 8s
  
  # Performance
  sequential_processing: true  # Phase 1: Process pages sequentially
  parallel_pages: false  # Phase 3: Will enable parallel processing
  batch_size: 1  # Currently process one page at a time
  
  # Logging
  log_level: "INFO"
  detailed_logging: false  # Set to true for debugging

# ============================================================================
# QUALITY THRESHOLDS
# ============================================================================
# Minimum quality scores for successful processing

quality:
  # Overall document quality
  minimum_overall_score: 0.5  # Below this = processing failed
  
  # Per-page quality
  minimum_page_score: 0.3  # Below this = flag page as low quality
  
  # Metadata extraction quality
  minimum_metadata_completeness: 0.6  # At least 60% of expected fields
  
  # Warning thresholds
  warn_below_score: 0.7  # Log warning if quality < 0.7

# ============================================================================
# METADATA EXTRACTION (HYBRID APPROACH)
# ============================================================================
# V3-validated hybrid regex + VLM approach
# Use fast regex when confidence is high, fallback to VLM when low

metadata:
  # Confidence thresholds for hybrid approach
  # If regex confidence >= threshold, use regex (fast)
  # If regex confidence < threshold, use VLM (slower but more accurate)
  
  doi_confidence_threshold: 0.85
  # Threshold breakdown:
  # - 0.98: Labeled DOI ("DOI: 10.xxxx")
  # - 0.95: URL format ("https://doi.org/10.xxxx")
  # - 0.85: Bare DOI in body text
  
  isbn_confidence_threshold: 0.85
  # Articles rarely have ISBN, but threshold ready for book chapters
  
  # Metadata validation
  validate_doi_format: true  # Check DOI matches pattern "10.xxxx/..."
  validate_year_range: true  # Check year is 1400-current_year+1
  
  # Fallback strategy if metadata extraction fails
  fallback_to_pdf_metadata: true  # Try PyMuPDF metadata as last resort

# ============================================================================
# PERFORMANCE SETTINGS
# ============================================================================
# Optimization settings for processing speed vs quality

performance:
  # Image preprocessing
  image_format: "png"  # From universal provider config
  image_padding: 200  # Padding around page images
  
  # Caching
  enable_caching: false  # Not implemented in Phase 1
  cache_directory: null
  
  # Timeout settings
  page_timeout_seconds: 300  # 5 minutes per page
  total_timeout_seconds: 1800  # 30 minutes total (for very long articles)
  
  # Memory management
  clear_pdf_after_processing: true  # Close PDF doc to free memory

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================
# Controls the structure and format of processing results

output:
  # Include in results
  include_raw_vlm_output: false  # Saves space
  include_page_metadata: true  # Keep per-page metadata
  include_quality_scores: true  # Include quality scores in output
  
  # Content formatting
  markdown_format: true  # Output content in markdown
  preserve_structure: true  # Preserve headings, tables, etc.
  
  # Error reporting
  detailed_errors: true  # Include full error messages
  include_warnings: true  # Include quality warnings

# ============================================================================
# KNOWN LIMITATIONS & NOTES
# ============================================================================
# Documentation of known issues and limitations

limitations:
  - "DOI extraction depends on footer visibility - may fail if footer is cropped"
  - "Title page metadata requires high resolution (1288px) for accurate DOI capture"
  - "Processing time: ~21s for title page (1288px), ~5s per body page (1024px)"
  - "Some articles don't include DOI on first page - will attempt extraction but may fail"

notes:
  - "Configuration based on testing Oct 1-4, 2025"
  - "Resolution settings validated with benchmark: 76.2% quality at 1024px"
  - "Hybrid approach threshold (0.85) based on V3 accuracy testing: 95%+ success rate"
  - "Title page resolution (1288px) specifically chosen to capture footer DOI"

# ============================================================================
# VALIDATION & TESTING
# ============================================================================

validation:
  # Expected fields in output
  required_metadata_fields:
    - "title"
    - "authors"
    - "doi"  # May be null if not found
  
  # Expected content structure
  required_content_fields:
    - "pages"  # List of ContentPage objects
    - "metadata"  # ExtractedMetadata object
  
  # Test documents (for validation)
  test_documents:
    - "sample_pdfs/research_article_with_doi.pdf"
    - "sample_pdfs/review_article_multipage.pdf"

# ============================================================================
# VERSION HISTORY
# ============================================================================

version_history:
  "1.1":
    date: "2025-10-28"
    changes:
      - "Phase 3 Integration: Added 5-Tier Adaptive Routing System"
      - "Created olmocr-2-7b profile with two_shot_parameters support"
      - "Added tier definitions: PyMuPDF, Surgical VLM, Single-Shot, Two-Shot, Fallback"
      - "Implemented adaptive_routing_rules for intelligent page routing"
      - "Integrated OlmOCR Hybrid System two-shot processing for complex pages"
    author: "Claude 4 Sonnet"
    notes: "Configuration-driven implementation preserves VLM-agnostic design"
  
  "1.0":
    date: "2025-10-05"
    changes:
      - "Initial configuration based on VLM provider testing"
      - "Hybrid approach thresholds from V3 validation"
      - "Resolution settings from Oct 1-4 testing"
    author: "Claude 4 Sonnet"
