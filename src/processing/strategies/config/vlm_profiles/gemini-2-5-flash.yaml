# Gemini 2.5 Flash Vision API Profile
# Cloud-based VLM - Fast and cost-effective (fallback model)
# Created: December 10, 2025

model_name: "gemini-2.5-flash"
model_type: "cloud_api_gemini"
benchmark_score: null  # To be measured
status: "testing"

# ============================================================================
# API PARAMETERS (Sent to Gemini API)
# ============================================================================
# Optimized for speed and cost-effectiveness
api_parameters:
  temperature: 0.4          # Balanced for OCR tasks
  max_tokens: 8192          # Sufficient for most pages

# ============================================================================
# APPLICATION CONFIGURATION
# ============================================================================
# Shastrasaara pipeline settings for Gemini processing
app_config:
  target_image_size: 1024    # Resize before sending (cost optimization)
  preferred_image_format: "png"
  target_anchor_text_len: 1000

# ============================================================================
# HYBRID PROCESSING (Enable Pattern Classifier)
# ============================================================================
hybrid_processing:
  enabled: true
  page_classifier:
    confidence_threshold: 0.90  # High confidence for text-only
    visual_threshold: 1         # 1+ images = visual page
    equation:
      total_confidence_threshold: 1.5
      high_confidence_count: 2
  visual_clustering:
    dbscan_eps: 50
    dbscan_min_samples: 2
    reference_dpi: 300

# ============================================================================
# CAPABILITIES
# ============================================================================
capabilities:
  - vision
  - document_understanding
  - ocr
  - cloud_api

# ============================================================================
# PERFORMANCE & COST (Gemini 2.5 Flash)
# ============================================================================
performance:
  speed: "very_fast"
  cost_per_page: 0.001        # USD (significantly cheaper than 3 Pro)
  pricing:
    input_cost_per_million: 0.10
    output_cost_per_million: 0.40
  rate_limit_free: "100 requests/day"
  rate_limit_paid: "1000 requests/day"

# ============================================================================
# RATE LIMITS (Google AI Studio / Vertex AI)
# ============================================================================
rate_limits:
  free_tier:
    requests_per_minute: 15   # Higher than 3 Pro
    requests_per_day: 100
    tokens_per_minute: 1000000

  paid_tier:
    requests_per_minute: 1000
    requests_per_day: 10000
    tokens_per_minute: 4000000

# ============================================================================
# NOTES
# ============================================================================
notes:
  - "Requires GEMINI_API_KEY in .env file"
  - "10x cheaper than Gemini 3 Pro"
  - "Faster processing time"
  - "Ideal for fallback scenarios"
  - "Best for users with limited GPU hardware (< 8GB VRAM)"
