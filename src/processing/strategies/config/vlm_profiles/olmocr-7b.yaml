# OlmOCR-7B VLM Profile for Strategy Usage
# Self-contained configuration for using olmocr-7b in document processing strategies
# Optimized settings based on testing: October 1-4, 2025
# Version: 1.0

# ============================================================================
# MODEL IDENTIFICATION
# ============================================================================
model_name: "olmocr-7b"
model_type: "specialized_ocr"
model_family: "olmocr"
version: "7b-baseline"

description: "Specialized OCR model optimized for academic document processing with markdown output"

# ============================================================================
# RESOURCE REQUIREMENTS (For Concurrency Calculation)
# ============================================================================
resource_requirements:
  vram_per_instance_gb: 7.5  # User-measured VRAM usage


# Status and readiness
status: "production_ready"
benchmark_score: 76.2  # Quality score from multi-page testing
last_optimized: "2025-10-04"

# ============================================================================
# SERVER CONFIGURATION REFERENCE
# ============================================================================
# This VLM profile references the model defined in llama-swap config
server_config:
  config_path: "D:\\LLMs\\Shastrasaara\\llama_cpp_bin\\run_swap_Config.yaml"
  model_key: "olmocr-7b"  # Must match model identifier in llama-swap config
  
  # Server defaults (from llama-swap, for reference only)
  server_defaults:
    temp: 0.4
    top_p: 0.95
    min_p: 0.05
    top_k: 40
    repeat_penalty: 1.1  # General purpose default
    threads: 8
    ctx_size: 10000
    flash_attn: true
    n_gpu_layers: 99
  
  note: |
    Server defaults above are for GENERAL PURPOSE use.
    API parameters below are OPTIMIZED FOR PDF PROCESSING and will override server defaults.
    This is intentional - PDF extraction needs different settings than general chat.

# ============================================================================
# OPTIMIZED API PARAMETERS (OVERRIDE SERVER DEFAULTS)
# ============================================================================
# These parameters are sent to the VLM API and OVERRIDE server defaults
# Server defaults (in run_swap_Config.yaml) are for general purpose use
# These are OPTIMIZED FOR PDF PROCESSING through extensive testing Oct 1-4, 2025
# CRITICAL: Do NOT use server defaults - they cause catastrophic loops in PDF extraction!

api_parameters:
  # Sampling parameters
  temperature: 0.4
    # Same as server default - works well for deterministic extraction
    # Range: 0.0 (deterministic) to 2.0 (very random)
  
  max_tokens: 4096
    # OVERRIDE: Server has no max_tokens limit set
    # Increased from default to handle full page extraction
    # Typical page: 1500-3000 tokens
  
  # Repetition control (CRITICAL - OVERRIDES SERVER DEFAULTS)
  repeat_penalty: 1.15
    # OVERRIDE: Server default is 1.1 (too low for PDF processing)
    # Higher value prevents token-level repetition
    # Optimized for PDF extraction to prevent immediate duplicates
  
  frequency_penalty: 0.1
    # CRITICAL: Not in server config - we add it via API
    # OPTIMAL value found through testing (tested 0.1, 0.2, 0.3)
    # Prevents catastrophic loops without over-suppressing content
    # This is the KEY parameter that makes PDF extraction stable
  
  # IMPORTANT: DO NOT include presence_penalty
  # presence_penalty: 0.0  # NEVER USE - causes catastrophic loops at 1024+ resolution
  # Server doesn't have it, and we explicitly avoid it in API requests

# ============================================================================
# RESOLUTION SETTINGS
# ============================================================================
# Default resolution for image preprocessing
# Can be overridden by strategy for specific tasks

default_resolution: 1024
  # Optimal balance of quality vs speed
  # Testing showed: 910px misses details, 1288px too slow, 1024px perfect

resolution_notes:
  optimal: 1024
  minimum: 910
  maximum: 1288
  rationale: "1024px provides 76.2% quality at 109s/page. 910px faster but misses details. 1288px captures footer (DOI) but slower."

# Resolution recommendations by use case
resolution_recommendations:
  title_page: 1288  # Higher res to capture footer DOI
  body_content: 1024  # Balanced quality/speed
  quick_preview: 910  # Fast preview, acceptable quality

# ============================================================================
# PERFORMANCE CHARACTERISTICS
# ============================================================================
# Real-world performance metrics from testing

performance:
  # Processing speed
  avg_time_per_page_1024px: 109  # seconds
  avg_time_per_page_1288px: 130  # seconds (estimated)
  avg_time_per_page_910px: 85    # seconds (estimated)
  
  # Quality metrics
  quality_score_1024px: 0.762
  content_extraction_rate: "22% more than baseline"
  json_parsing_success_rate: 1.0  # 100% with current settings
  
  # Reliability
  catastrophic_loop_rate: 0.0  # With frequency_penalty=0.1
  page_failure_rate: 0.0       # All pages extract successfully

# ============================================================================
# TASK COMPATIBILITY
# ============================================================================
# Which tasks this VLM can handle

compatible_tasks:
  - "title_page_metadata_extraction"
  - "olmocr_document_processing"
  - "basic_ocr"
  - "academic_extraction"

recommended_tasks:
  primary:
    - "olmocr_document_processing"  # Best use case
    - "title_page_metadata_extraction"
  secondary:
    - "basic_ocr"

incompatible_tasks:
  - "image_generation"  # Not a generative model
  - "chat"  # Specialized for document extraction

# ============================================================================
# OUTPUT FORMAT
# ============================================================================
# What this VLM produces

output_format:
  type: "json"
  structure: "yaml_frontmatter_markdown"
  
  # Expected fields in JSON output
  standard_fields:
    - "primary_language"
    - "is_rotation_valid"
    - "rotation_correction"
    - "is_table"
    - "is_diagram"
    - "natural_text"  # Main content in markdown
  
  # Content format
  content_format: "markdown"
  supports_latex: true
  supports_tables: true
  supports_code_blocks: true

# ============================================================================
# KNOWN LIMITATIONS & GOTCHAS
# ============================================================================

limitations:
  resolution:
    - "Footer content may be cropped at 1024px resolution"
    - "DOI in footer requires 1288px resolution for reliable capture"
  
  parameters:
    - "presence_penalty causes catastrophic loops at 1024+ resolution"
    - "frequency_penalty > 0.2 causes under-extraction"
    - "temperature > 0.6 reduces extraction accuracy"
  
  content:
    - "Complex tables may have formatting issues"
    - "Handwritten text not well supported"
    - "Very low contrast images may fail"

gotchas:
  - name: "Catastrophic Loops"
    description: "Using presence_penalty > 0.0 causes infinite repetition"
    solution: "Use frequency_penalty=0.1 instead"
  
  - name: "Footer Cropping"
    description: "DOI in footer cropped at 1024px"
    solution: "Use 1288px resolution for title pages"
  
  - name: "Under-extraction"
    description: "frequency_penalty too high suppresses content"
    solution: "Keep frequency_penalty between 0.1-0.2"

# ============================================================================
# OPTIMIZATION HISTORY
# ============================================================================

optimization_history:
  "2025-10-04":
    finding: "frequency_penalty=0.1 is optimal"
    tested_values: [0.1, 0.2, 0.3]
    result: "0.1 provides best extraction without loops"
    configurations_tested:
      - "910px + presence_penalty=0.4: Fast but under-extracts"
      - "1024px + presence_penalty=0.2: Catastrophic loops"
      - "1024px + presence_penalty=0.4: Worse catastrophic loops"
      - "1024px + frequency_penalty=0.3: Page 5 complete failure"
      - "1024px + frequency_penalty=0.1: WINNER - no loops, full extraction"
  
  "2025-10-03":
    finding: "1024px resolution optimal"
    tested_values: [910, 1024, 1288]
    result: "1024px best balance quality/speed"
  
  "2025-10-02":
    finding: "presence_penalty causes toxic behavior"
    result: "Disabled presence_penalty, switched to frequency_penalty"

# ============================================================================
# USAGE RECOMMENDATIONS
# ============================================================================

recommendations:
  general:
    - "Use default settings for most tasks"
    - "Override resolution for title pages (1288px)"
    - "Monitor for quality scores < 0.5"
  
  title_page_extraction:
    resolution: 1288
    reason: "Captures footer DOI"
    expected_time: "~21 seconds"
  
  body_content_extraction:
    resolution: 1024
    reason: "Optimal quality/speed balance"
    expected_time: "~5-6 seconds per page"
  
  batch_processing:
    - "Use 1024px for all pages except first"
    - "Process sequentially (parallel not yet supported)"
    - "Expect ~109s per page average"

# ============================================================================
# STRATEGY INTEGRATION NOTES
# ============================================================================

strategy_notes:
  research_article:
    - "Use 1288px for page 1 (title page)"
    - "Use 1024px for pages 2+ (body)"
    - "DOI hybrid threshold: 0.85"
  
  book_chapter:
    - "Use 1024px for all pages"
    - "Chapter number extraction from page 1"
  
  book:
    - "Use 1024px for TOC and body"
    - "Higher resolution not needed for full books"

# ============================================================================
# TIER 4: 3-Tier Hybrid Processing Configuration (October 11, 2025)
# ============================================================================
# Controls the intelligent hybrid processing system that routes pages
# to optimal processors based on content type
hybrid_processing:
  enabled: true  # Master switch - set to false for instant rollback to VLM-only
  
  page_classifier:
    confidence_threshold: 0.85  # Minimum confidence to use PyMuPDF extraction
    enable_vlm_verification: true  # Use VLM to verify low-confidence equations
    
    # Equation detection thresholds
    equation:
      total_confidence_threshold: 2.5  # Sum of all equation confidence scores
      high_confidence_count: 2  # Number of high-confidence equations required
      high_confidence_min: 0.9  # Minimum score to count as high-confidence
    
    # Visual element detection
    visual_threshold: 3  # Number of figures/tables to classify as VISUAL_HEAVY

  visual_clustering:
      enabled: true
      dbscan_eps: 50          # Epsilon value calibrated for 300 DPI documents.
      dbscan_min_samples: 2   # Minimum drawings to form a figure (e.g., 2 lines).
      reference_dpi: 300      # The DPI that the above 'eps' value is tuned for.
      
      # DPI TUNING GUIDE:
      # The 'eps' value should be scaled if your primary source documents
      # have a different native resolution.
      # - 150 DPI scans: Use eps ~25 (half of the 300 DPI value)
      # - 600 DPI high-res: Use eps ~100 (double the 300 DPI value)
      # The rule of thumb is that eps scales linearly with the DPI ratio.

  surgical_vlm:
    task_config_path: "config"  # Path to task_definitions directory
    enabled_tasks:
      - figure_description
      - equation_to_latex
      - table_description

