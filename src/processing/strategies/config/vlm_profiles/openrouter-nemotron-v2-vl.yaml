model_name: "nvidia/nemotron-nano-12b-v2-vl:free"
model_type: "cloud_api_openai"
status: "production_ready"
benchmark_score: 94.1

# Notes for GUI display
notes:
  - "OpenRouter Free Vision Model"
  - "NVIDIA Nemotron 12B with Reasoning"

cloud_config:
  api_endpoint: "https://openrouter.ai/api/v1/chat/completions"
  api_key_env: "OPENROUTER_API_KEY"
  timeout: 120

api_parameters:
  temperature: 0.7
  max_tokens: 4096
  # OpenRouter/Nemotron specific: Enable reasoning
  reasoning:
    enabled: true

# Pricing info for GUI cost display
pricing:
  input_cost_per_million: 0.0
  output_cost_per_million: 0.0
  tier: "free"
