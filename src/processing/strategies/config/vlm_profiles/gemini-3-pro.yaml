# Gemini 3 Pro Vision API Profile
# Cloud-based VLM for users with limited GPU hardware
# Created: December 10, 2025

model_name: "gemini-3-pro-preview"
model_type: "cloud_api_gemini"
benchmark_score: null  # To be measured
status: "testing"

# ============================================================================
# API PARAMETERS (Sent to Gemini API)
# ============================================================================
# Standard Gemini API parameters for document processing
api_parameters:
  temperature: 0.4          # Balanced for OCR tasks
  max_tokens: 8192          # Sufficient for most pages

# ============================================================================
# APPLICATION CONFIGURATION
# ============================================================================
# Shastrasaara pipeline settings for Gemini processing
app_config:
  target_image_size: 1024    # Resize before sending (cost optimization)
  preferred_image_format: "png"
  target_anchor_text_len: 1000

# ============================================================================
# CAPABILITIES
# ============================================================================
capabilities:
  - vision
  - document_understanding
  - ocr
  - cloud_api

# ============================================================================
# PERFORMANCE & COST (Gemini 3 Pro)
# ============================================================================
performance:
  speed: "fast"
  cost_per_page: 0.011        # USD (560 input + ~750 output tokens avg)
  pricing:
    input_cost_per_million: 2.00
    output_cost_per_million: 12.00
  rate_limit_free: "100 requests/day"
  rate_limit_paid: "1000 requests/day"

# ============================================================================
# RATE LIMITS (Google AI Studio / Vertex AI)
# ============================================================================
rate_limits:
  free_tier:
    requests_per_minute: 5
    requests_per_day: 100
    tokens_per_minute: 250000

  paid_tier:
    requests_per_minute: 300
    requests_per_day: 1000
    tokens_per_minute: 1000000

# ============================================================================
# NOTES
# ============================================================================
notes:
  - "Requires GEMINI_API_KEY in .env file"
  - "Free tier: 100 RPD via Google AI Studio"
  - "Paid tier: 1000+ RPD via Vertex AI or Pay-as-you-go"
  - "Pricing: $2/M input tokens, $12/M output tokens"
  - "Best for users with limited GPU hardware (< 8GB VRAM)"
