# Official OlmOCR Model Profile
# Three-Tier Parameter Architecture - Target Implementation

model_name: "allenai/olmOCR-7B-0825-FP8"  # Official HuggingFace identifier (for reference)
model_type: "official_specialized_ocr"
benchmark_score: 77.4  # Official benchmark score
status: "target_implementation"

# ============================================================================
# TIER 1: API Parameters (sent to /v1/chat/completions endpoint)
# ============================================================================
# These parameters override server defaults on a per-request basis
# CRITICAL: Only include parameters actually accepted by llama.cpp API
api_parameters:
  temperature: 0.7  # Official OlmOCR recommended temperature

# ============================================================================
# TIER 2: Server Configuration (DOCUMENTATION ONLY - not sent in API requests)
# ============================================================================
# Official OlmOCR recommendations for server configuration
# These would be configured in llama-swap run_swap_Config.yaml
server_config:
  # Recommended server startup parameters
  ctx_size: 10000  # Context window size
  flash_attn: true  # Flash attention for speed
  n_gpu_layers: 99  # GPU acceleration
  
  # Official OlmOCR sampling recommendations (server defaults)
  default_temp: 0.7
  default_top_p: 0.95
  default_repeat_penalty: 1.1
  
  # NOTE: When deployed, create llama-swap config entry named "olmocr-official"
  # to match this profile's model_name for API requests

# ============================================================================
# TIER 3: Application Configuration (OlmOCR-specific pipeline settings)
# ============================================================================
# Official OlmOCR application-level recommendations
app_config:
  target_anchor_text_len: 1000  # OCR anchor text length (from research)
  target_dpi: 300  # Recommended image resolution
  preferred_image_format: "png"  # Recommended format
  # Official OlmOCR uses guided_decoding in VLLM, but not applicable to llama.cpp

# ============================================================================
# Expected Performance (from official benchmarks)
# ============================================================================
performance:
  target_benchmark_score: 77.4  # Official olmOCR-Bench score
  target_time_per_page: 26.0  # Estimated processing time
  metadata_fields_target: 7  # YAML front matter fields
  outperforms:
    - "nanonets_ocr"
    - "gpt4o"
    - "gemini_flash2"

# ============================================================================
# Enhanced Capabilities (from official documentation)
# ============================================================================
capabilities:
  - document_structure_understanding
  - yaml_front_matter_generation
  - equation_to_latex_conversion
  - table_to_markdown_conversion
  - cross_page_context
  - rotation_detection
  - multi_column_layout_handling

# ============================================================================
# DEPLOYMENT NOTES:
# ============================================================================
# To use this official profile:
# 1. Add entry to llama-swap run_swap_Config.yaml named "olmocr-official"
# 2. Point to official model: olmOCR-7B-0825-FP8.gguf
# 3. Use server_config recommendations above
# 4. Update test to use MODEL_UNDER_TEST = "olmocr-official"
# 
# Currently using "olmocr-7b" as working baseline while this is target implementation
