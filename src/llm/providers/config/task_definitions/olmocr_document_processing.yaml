# OlmOCR Document Processing Task Definition
# Official prompt MODIFIED for JSON output
# Based on research: October 1, 2025

task_name: "olmocr_document_processing"
task_type: "structured_document_understanding"
description: "Official OlmOCR-7B-0825 document processing with JSON output"

# MODIFIED PROMPT: Explicit JSON format with example
prompt: |
  ### Instruction:
  You MUST respond with ONLY a valid JSON object. NO other text, explanations, descriptions, or markdown formatting outside the JSON.

  **CRITICAL: Your ENTIRE response must be valid JSON matching this exact schema:**
  ```json
  {
    "primary_language": "en",
    "is_rotation_valid": true,
    "rotation_correction": 0,
    "is_table": false,
    "is_diagram": false,
    "natural_text": "Your extracted text in markdown format goes here..."
  }
  ```

  **Field Descriptions:**
  - `primary_language`: Two-letter code (e.g., 'en')
  - `is_rotation_valid`: boolean - is page oriented correctly?
  - `rotation_correction`: integer - degrees clockwise (0, 90, 180, 270)
  - `is_table`: boolean - is MAJORITY of page a table?
  - `is_diagram`: boolean - is MAJORITY of page a diagram?
  - `natural_text`: string - ALL page text in markdown format

  **For natural_text field:**
  - Extract ALL visible text in reading order
  - Use Markdown: headers (##), bold (**text**), tables (| A | B |)
  - Math equations in LaTeX: $inline$ or $display$
  - Figure captions: **Figure 1:** Caption text
  - NO image descriptions, NO hallucinations

  **RESPONSE FORMAT RULES:**
  1. Output ONLY the JSON object
  2. You may wrap it in ```json ... ``` if needed
  3. Use lowercase `true`/`false` for booleans
  4. All field names exactly as shown
  5. DO NOT output plain text, descriptions, or explanations

  ### Response:

# Expected output format - OFFICIAL JSON SCHEMA from paper Appendix E.1
output_format:
  type: "json"
  grammar: | 
    root ::= "{" ws "\"primary_language\":" ws string "," ws "\"is_rotation_valid\":" ws bool "," ws "\"rotation_correction\":" ws number "," ws "\"is_table\":" ws bool "," ws "\"is_diagram\":" ws bool "," ws "\"natural_text\":" ws string "}"
    string ::= "\"" ([^"\\] | "\\" (["\\/bfnrt] | "u" [0-9a-fA-F]{4}))* "\""
    number ::= "-"? ([0-9] | [1-9] [0-9]{0,15}) ("." [0-9]+)? ([eE] [-+]? [0-9]+)?
    bool ::= "true" | "false"
    ws ::= [ \t\n]*
  schema:
    primary_language:
      type: "string"
      description: "Two-letter language code (e.g., 'en', 'es', 'fr') or null"
      example: "en"
    is_rotation_valid:
      type: "boolean"
      description: "Is this page oriented correctly for reading? Only considers textual content"
      example: true
    rotation_correction:
      type: "integer"
      description: "Degrees of clockwise rotation needed (0, 90, 180, 270)"
      enum: [0, 90, 180, 270]
      example: 0
    is_table:
      type: "boolean"
      description: "True if MAJORITY of page content is in tabular format (page-level classification)"
      example: false
    is_diagram:
      type: "boolean"
      description: "True if MAJORITY of page content is a visual diagram (page-level classification)"
      example: false
    natural_text:
      type: "string"
      description: "The natural text content in markdown format (includes tables, equations, figure captions)"
      example: "## Title\n\nContent here...\n\n**Table 1**: Caption\n\n| A | B |\n|---|---|\n| 1 | 2 |"
  
  # Content formatting within natural_text
  equation_format: "latex"  # Inline: $ eq $ or Display: $$ eq $$
  table_format: "markdown_or_html"  # Markdown for simple, HTML for rowspan/colspan
  figure_handling: "extract_captions_only"  # Extract visible text (captions, labels) - NO image descriptions

# Model-specific parameters for olmOCR-7B-0825
model_parameters:
  model_id: "allenai/olmOCR-7B-0825"
  base_model: "Qwen/Qwen2.5-VL-7B-Instruct"
  image_resolution: 1288  # CRITICAL: 0825 uses 1288px, NOT 1024px!
  max_model_len: 16384
  temperature: 0.1
  temperature_on_retry: 0.8  # Increase on retry to escape repetition loops
  max_retries: 3

# Quality targets from olmOCR-Bench (official benchmark)
quality_targets:
  benchmark_score: 80.0  # olmOCR-7B-0825 improved from 77.4%
  metadata_fields: 5  # Only 5 official fields (no has_images, no image_count)
  structure_understanding: true
  equation_accuracy: "KaTeX-compatible LaTeX"
  table_accuracy: "Markdown or HTML with rowspan/colspan support"
  
# Important notes based on research
notes:
  - "Model outputs JSON when explicitly requested with correct boolean format"
  - "Must use lowercase true/false (JSON format) not True/False (Python format)"
  - "Field names must be exact: is_table NOT the_table, is_diagram NOT the_diagram"
  - "Parse the 'natural_text' field for document content"
  - "is_table and is_diagram are PAGE-LEVEL classifications (not element detection)"
  - "Figure captions are extracted as text in natural_text (no image descriptions)"
  - "Tables appear as markdown or HTML in natural_text"
  - "Document anchoring (base_text) significantly reduces hallucinations - TO BE IMPLEMENTED"
  - "Model was trained to NOT generate image descriptions"
  - "Image resolution MUST be 1288px for olmOCR-7B-0825"

# Features NOT supported (removed from our implementation)
removed_features:
  - "has_images field - NEVER in official schema"
  - "image_count field - NEVER in official schema"
  - "Image description section - Model trained to AVOID this"
  - "YAML front matter - Model trained on JSON output"
  
# Document anchoring guidance (TO BE IMPLEMENTED)
document_anchoring:
  enabled: false  # Set to true when implemented
  description: "Extract text blocks and image positions from PDF using pypdf"
  format: "[x_coord,y_coord]text content"
  coordinate_origin: "Lower-left corner [0,0]"
  max_chars: 6000
  priority_order:
    - "Text blocks at document start"
    - "Text blocks at document end"
    - "Image locations"
  note: "Significantly improves accuracy and reduces hallucinations - REQUIRED for optimal performance"
  status: "PENDING IMPLEMENTATION - Currently using direct JSON request as workaround"
