# Comprehensive Single-Pass Extraction Task
# Phase 3 Integration - Single-Pass Architecture
# Created: December 10, 2025

task_name: "comprehensive_single_pass_extraction"
description: "Extract text, layout, figures, tables, and metadata in a single pass"
task_type: "visual_extraction"
status: "test"

# ============================================================================
# PROMPT CONFIGURATION
# ============================================================================
prompt: |
  You are an expert document analyzer responsible for digitizing academic and technical documents.
  Your goal is to extract ALL information from the provided page image into a structured, faithful markdown representation.
  
  TASK REQUIREMENTS:
  
  1. **Layout & Flow**:
     - Preserve the reading order of the document.
     - Use appropriate markdown headers (#, ##) for section titles.
     - Preserve paragraph boundaries.
  
  2. **Figures**:
     - Detect all figures/charts/images.
     - For each figure, insert a placeholder: `[FIGURE: <brief_description>]`.
     - Immediately follow the placeholder with the exact caption text found in the image, italicized (e.g., *Figure 1: Caption text...*).
  
  3. **Tables**:
     - Convert all tables into Markdown tables.
     - Ensure columns align correctly.
     - Capture all headers and cell content accurately.
     - Allow usage of HTML <table> tags if the table structure is too complex for markdown.
  
  4. **Formulas**:
     - Convert all mathematical equations into LaTeX format.
     - Inline equations: `$...$`
     - Block equations: `$$...$$`
  
  5. **Metadata (Special Case)**:
     - IF this page is the TITLE PAGE of a paper, extract bibliographic metadata in a JSON block at the very top of the response:
       ```json
       {
         "metadata": {
           "title": "Main article title only",
           "authors": ["Author1", "Author2"],
           "doi": "10.xxxx/xxxxx or null",
           "journal_name": "Journal name or null",
           "publication_year": <integer YYYY or null>
         }
       }
       ```
     - **CRITICAL METADATA INSTRUCTIONS** (from proven extraction experience):
       * **DOI** (MOST IMPORTANT): Check page footer, header, sidebar, and citation blocks. Look for patterns like "DOI:", "doi.org/", or "10.". If not found, use null.
       * **Title**: Main article title ONLY. Do not include subtitles, abstracts, institution names, or section headings.
       * **Authors**: List of full names without affiliations or superscripts. Example: "John Doe, Jane Smith" → ["John Doe", "Jane Smith"]
       * **Journal**: Journal name only, no publisher or volume info. Use null if not found.
       * **Year**: INTEGER type (e.g., 2023, 2024, 2025), NOT string. If full date present (e.g., "April 3, 2024"), extract year only. Use null if not found.
     - If it is NOT a title page, DO NOT include this metadata block.
  
  RESPONSE RULES:
  - Respond ONLY with the markdown content.
  - Do NOT wrap the entire response in logical blocks like "Here is the output". Just give the output.
  - Do not hallucinate content not present in the image.

# ============================================================================
# OUTPUT FORMAT
# ============================================================================
output_format:
  type: "markdown"
  schema:
    type: "string"
    description: "Structured markdown content of the page."
