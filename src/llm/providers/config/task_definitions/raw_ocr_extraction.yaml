# Raw OCR Extraction Task Definition
# Shot 1 of Two-Shot Processing
# Phase 3 Integration - 5-Tier Adaptive Routing
# Created: October 28, 2025
# Updated: November 3, 2025 - Removed anchor text markers (biasing model)

task_name: "raw_ocr_extraction"
description: "Shot 1: Faithful optical character recognition for two-shot processing"
task_type: "ocr"
status: "production"

# ============================================================================
# PROMPT CONFIGURATION
# ============================================================================
# CRITICAL: No RAW_TEXT_START/END markers - they bias the model!
# The model should see ONLY the image with NO text guidance
# This matches the working OlmOCR_run_hybrid_v2.py when pdftotext fails
prompt: |
  Your sole task is to perform a complete, faithful optical character recognition (OCR) of the attached document image.
  
  CRITICAL INSTRUCTIONS:
  1. Transcribe ALL text you see, starting from the absolute top edge to the absolute bottom edge of the page
  2. Include ALL content: headers, footers, page numbers, side columns, captions, footnotes
  3. Maintain the natural reading order (left-to-right, top-to-bottom for multi-column layouts)
  4. Preserve special characters, equations, superscripts, subscripts as you see them
  5. Output ONLY the raw, transcribed text - no analysis, no formatting, no commentary
  
  Your goal is to capture EVERY visible character on the page with perfect fidelity.

# ============================================================================
# OUTPUT FORMAT
# ============================================================================
output_format:
  type: "text"
  description: "Raw transcribed text with no structure or formatting"

# ============================================================================
# TEMPERATURE REQUIREMENTS
# ============================================================================
# Shot 1 MUST use temperature: 0.05 for faithful transcription
# This is configured in olmocr-2-7b.yaml under two_shot_parameters.shot1_ocr

# ============================================================================
# DESIGN PHILOSOPHY
# ============================================================================
# This task implements "guided OCR" - the model uses anchor text as structural context.
# 
# WHY USE ANCHOR TEXT?
# - Anchor text from DocumentAnchoringExtractor provides COMPLETE page structure
# - Prevents early stopping at visual boundaries (diagrams, figures, tables)
# - Example: Page 3 with large diagram - anchor text shows figure caption exists below
# - CRITICAL: Must use COMPLETE anchor text, not partial (partial text causes bias)
#
# This matches the successful OlmOCR_run_hybrid_v2.py behavior which used anchor_text
# from pdftotext to guide extraction. Testing showed:
# - WITH anchor text: 3,467 chars extracted (complete with caption) ✅
# - WITHOUT anchor text: 3,273 chars extracted (missing caption) ❌

# ============================================================================
# USAGE NOTES
# ============================================================================
# This task is specifically designed for the first shot of two-shot processing.
# The output will be:
# 1. Post-processed for paragraph-level deduplication
# 2. Fed as input to Shot 2 (structured_analysis_body_page.yaml or structured_analysis_title_page.yaml)
# 
# Expected output length: 3,000-8,000 characters for typical academic pages
# Actual test results: 5,000+ characters for complex title pages with full content
