#.\src\v4\gemini_refactor\src\llm\providers\config\universal_config.yaml
# Universal VLM Provider Configuration
# Global settings for all models and tasks
# UPDATED FOR PYDANTIC VALIDATION

# API endpoint (HttpUrl validated)
api_endpoint: "http://localhost:8080/v1/chat/completions"

# Timeout configuration (int validated)
timeout_seconds: 300

# Model selection (str validated)
default_model: "olmocr-7b"
fallback_model: "numarkdown-8b"

# Image processing settings (int/str validated)
image_padding: 200
conversion_dpi: 300
image_format: "png"

# Additional metadata for implementation guidance
metadata:
  provider_type: "universal_vlm"
  version: "2.1.0"
  created: "2025-09-28"
  updated: "2025-09-28"
  
  # Global processing settings
  global_settings:
    max_retries: 3
    enable_logging: true
    log_level: "INFO"
    
  # Performance settings
  performance:
    enable_caching: false
    batch_processing: false
    parallel_pages: false
    
  # Quality settings
  quality:
    enable_validation: true
    minimum_confidence: 0.5
    enable_fallback: true
    
  # Development settings
  development:
    debug_mode: false
    save_intermediate: false
    timing_enabled: true
